# Run this job on pushes to `main`, and for pull requests.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  # Lets the release workflow run the tests before publishing
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs uv and Python, and caches uv's downloads between runs, keyed on
      # uv.lock
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      # Install the locked dependencies, the dev group and the project itself.
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run flake8 nerpii tests

      - run: uv run pytest
