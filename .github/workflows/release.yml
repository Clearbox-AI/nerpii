name: Release
on:
  release:
    types: [published]
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.23"
        python-version: "3.12"
    - run: uv build
    - run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
