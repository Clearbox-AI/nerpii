[project]
name = "nerpii"
version = "0.3.0"
description = "A python library to perform NER on structured data and generate PII with Faker"
authors = [{ name = "Clearbox AI", email = "info@clearbox.ai" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26",
    "presidio-analyzer>=2.2.355,<3",
    "transformers>=4.40,<6",
    "faker>=30",
    "gender-guesser>=0.4.0,<0.5.0",
    "spacy>=3.7.2,<4",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/Clearbox-AI/nerpii"
Repository = "https://github.com/Clearbox-AI/nerpii"

[tool.poetry]
packages = [{ include = "nerpii" }]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"
pytest = "^9.0.3"
flake8 = "^7.1"
flake8-import-order = "^0.19.2"
flake8-black = "^0.4.0"
black = ">=24.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

