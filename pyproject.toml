[project]
name = "nerpii"
version = "0.3.0"
description = "A python library to perform NER on structured data and generate PII with Faker"
authors = [{ name = "Clearbox AI", email = "info@clearbox.ai" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26",
    "presidio-analyzer>=2.2.355,<3",
    "transformers>=4.40,<6",
    "faker>=30",
    "gender-guesser>=0.4.0,<0.5.0",
    "spacy>=3.7.2,<4",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/Clearbox-AI/nerpii"
Repository = "https://github.com/Clearbox-AI/nerpii"

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "pytest>=9.0.3,<10",
    "flake8>=7.1,<8",
    "flake8-import-order>=0.19.2,<0.20",
    "flake8-black>=0.4.0,<0.5",
    "black>=24.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at the repository root, not under src/
module-root = ""
